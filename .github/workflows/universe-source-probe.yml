name: Check midcap and largecap source classes
on:
  push:
    paths:
      - '.github/workflows/universe-source-probe.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect market-cap classes
        run: |
          node --input-type=module <<'NODE'
          function extractRows(html){
            const chunks=[];
            for(const m of html.matchAll(/self\.__next_f\.push\(\[1,("(?:\\.|[^"\\])*")\]\)/g)){try{chunks.push(JSON.parse(m[1]))}catch{}}
            const data=chunks.join("\n"),mark='"rows":',at=data.indexOf(mark);
            if(at<0)throw Error("rows missing");
            const start=at+mark.length;let d=0,q=false,e=false,end=-1;
            for(let i=start;i<data.length;i++){const c=data[i];if(q){if(e)e=false;else if(c==="\\")e=true;else if(c==='"')q=false;continue}if(c==='"'){q=true;continue}if(c==="[")d++;else if(c==="]"&&--d===0){end=i+1;break}}
            return JSON.parse(data.slice(start,end));
          }
          for(const cls of ["mid-cap","large-cap"]){
            const url="https://stockexact.com/stocks/"+cls;
            const res=await fetch(url,{headers:{"User-Agent":"Mozilla/5.0"}});
            const html=await res.text(),rows=extractRows(html);
            console.log("CLASS",cls,"HTTP",res.status,"ROWS",rows.length,"FIRST",JSON.stringify(rows.slice(0,3).map(r=>({symbol:r[1],name:r[2],mcap:r[8]}))),"LAST",JSON.stringify(rows.slice(-3).map(r=>({symbol:r[1],name:r[2],mcap:r[8]}))));
            const date=html.match(/By market cap at the close on ([^.]+)\./)?.[1];
            const method=html.match(/average market cap over the six months to ([^<,]+)/)?.[1];
            console.log("DATE",date,"WINDOW",method);
          }
          NODE
