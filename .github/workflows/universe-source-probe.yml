name: Probe market-cap universe pagination
on:
  push:
    paths:
      - '.github/workflows/universe-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect market-cap pagination
        run: |
          node --input-type=module <<'NODE'
          for (const page of [1,2,3,10]) {
            const url="https://stockexact.com/stocks/small-cap"+(page===1?"":"?page="+page);
            const res=await fetch(url,{headers:{"User-Agent":"Mozilla/5.0"}});
            const html=await res.text();
            const rows=html.split('<li><div class="sr-row sr-val">').slice(1).map(x=>x.split("</li>")[0]);
            const syms=rows.map(row=>row.split('class="sr-name" href="/stocks/')[1]?.split('"')[0]);
            const first=rows[0]?.split('class="sr-name" href="/stocks/')[1]?.split('">')[1]?.split("</a>")[0];
            const last=rows.at(-1)?.split('class="sr-name" href="/stocks/')[1]?.split('">')[1]?.split("</a>")[0];
            console.log("PAGE",page,"HTTP",res.status,"ROWS",rows.length,"UNIQUE",new Set(syms.filter(Boolean)).size,"FIRST",first,"LAST",last);
            if(page===1) {
              console.log("PAGINATION_LINKS",html.match(/href="[^"]*(?:page|cursor|offset)[^"]*"/gi)?.slice(-30));
              const nav=html.indexOf("Pagination");
              console.log("PAGINATION_TEXT",nav>=0?html.slice(nav-1000,nav+2500):html.slice(-5000));
            }
          }
          NODE
