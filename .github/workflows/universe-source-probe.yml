name: Probe market-cap universe source
on:
  push:
    paths:
      - '.github/workflows/universe-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect stock universe page
        run: node --input-type=module <<'NODE'
          const url = "https://stockexact.com/stocks/small-cap";
          const response = await fetch(url, {headers: {"User-Agent":"Mozilla/5.0","Accept":"text/html"}});
          console.log("HTTP",response.status,"TYPE",response.headers.get("content-type"));
          const html=await response.text();
          console.log("HTML_BYTES",html.length);
          for(const needle of ["Ather Energy","ATHERENERG","₹70,381 Cr","stocks/small-cap","__NEXT_DATA__","application/ld+json"]) {
           const i=html.indexOf(needle);
           console.log("\nNEEDLE",needle,"INDEX",i);
           if(i>=0) console.log(html.slice(Math.max(0,i-700),Math.min(html.length,i+1400)));
          }
          const anchors=[...html.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)];
          console.log("ANCHOR_COUNT",anchors.length);
          console.log("STOCK_LINKS",anchors.filter(x=>/\/stocks\//.test(x[1])).slice(0,12).map(x=>({href:x[1],text:x[2].replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160)})));
          
          NODE
