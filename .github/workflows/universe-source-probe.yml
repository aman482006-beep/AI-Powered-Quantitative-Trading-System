name: Smoke test additional India historical prices
on:
  push:
    paths:
      - '.github/workflows/universe-source-probe.yml'
jobs:
  history-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test max-available OHLCV for 10 additions
        run: |
          node --input-type=module <<'NODE'
          const symbols=["LICI","ICICIAMC","BHEL","LAURUSLABS","GROWW","ATHERENERG","WELCORP","RBLBANK","HCG","JLHL"];
          const end=Math.floor(Date.now()/1000)+86400;
          async function test(symbol){
            let lastError=null;
            for(const host of ["query1.finance.yahoo.com","query2.finance.yahoo.com"]){
              try{
                const target="https://"+host+"/v8/finance/chart/"+symbol+".NS?period1=0&period2="+end+"&interval=1d&events=div%2Csplits";
                const res=await fetch("https://proxy.cors.dev/"+target,{headers:{Accept:"application/json"},credentials:"omit"});
                if(!res.ok)throw Error("HTTP "+res.status);
                const json=await res.json(),result=json?.chart?.result?.[0];
                if(!result)throw Error(json?.chart?.error?.description||"No Yahoo result");
                const q=result.indicators.quote[0],timestamps=result.timestamp||[];
                const valid=timestamps.map((t,i)=>({t,o:q.open?.[i],h:q.high?.[i],l:q.low?.[i],c:q.close?.[i]})).filter(x=>[x.o,x.h,x.l,x.c].every(Number.isFinite));
                if(valid.length<2)throw Error("Only "+valid.length+" valid bars");
                return {symbol,status:"OK",bars:valid.length,first:new Date(valid[0].t*1000).toISOString().slice(0,10),last:new Date(valid.at(-1).t*1000).toISOString().slice(0,10)};
              }catch(e){lastError=e}
            }
            return {symbol,status:"FAILED",error:lastError?.message||"unknown"};
          }
          const out=[];
          for(let i=0;i<symbols.length;i+=3){out.push(...await Promise.all(symbols.slice(i,i+3).map(test)))}
          console.log("HISTORY_TEST",JSON.stringify(out));
          console.log("SUMMARY",JSON.stringify({tested:out.length,passed:out.filter(x=>x.status==="OK").length,failed:out.filter(x=>x.status!=="OK").length}));
          if(out.some(x=>x.status!=="OK"))process.exit(1);
          NODE
