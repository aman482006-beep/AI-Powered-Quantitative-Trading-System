name: Inspect market cap list client loader
on:
  push:
    paths:
      - '.github/workflows/universe-source-probe.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect page scripts
        run: |
          node --input-type=module <<'NODE'
          const base="https://stockexact.com";
          const html=await (await fetch(base+"/stocks/small-cap",{headers:{"User-Agent":"Mozilla/5.0"}})).text();
          const scripts=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(x=>x[1]);
          console.log("SCRIPTS",JSON.stringify(scripts));
          for(const path of scripts){
            try{
              const txt=await (await fetch(base+path,{headers:{"User-Agent":"Mozilla/5.0"}})).text();
              const findings=[];
              for(const term of ["Show all 500","small-cap","/api/","fetch(","api/stock","companies","stocks/"]){
                let p=-1,n=0;
                while((p=txt.toLowerCase().indexOf(term.toLowerCase(),p+1))>=0&&n<3){findings.push({term,at:p,snippet:txt.slice(Math.max(0,p-300),Math.min(txt.length,p+600))});n++}
              }
              if(findings.length)console.log("\nCHUNK",path,"SIZE",txt.length,"FINDINGS",JSON.stringify(findings));
            }catch(e){console.log("CHUNK_ERROR",path,e.message)}
          }
          NODE
